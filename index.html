<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Lucky Draw</title>
  
  <!-- SheetJS Library for Excel File Processing -->
  <script src="https://cdn.jsdelivr.net/npm/xlsx@0.18.5/dist/xlsx.full.min.js"></script>

  <style>
    body {
      font-family: Arial, sans-serif;
      background-color: #f4f6f8;
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      margin: 0;
    }
    .card {
      background: #ffffff;
      padding: 30px;
      border-radius: 12px;
      box-shadow: 0 4px 15px rgba(0,0,0,0.1);
      width: 100%;
      max-width: 480px;
      text-align: center;
    }

    /* Navigation Tabs */
    .tab-buttons {
      display: flex;
      gap: 10px;
      margin-bottom: 20px;
    }
    .tab-btn {
      flex: 1;
      padding: 10px;
      font-size: 14px;
      font-weight: bold;
      background-color: #e9ecef;
      color: #495057;
      border: none;
      border-radius: 6px;
      cursor: pointer;
    }
    .tab-btn.active {
      background-color: #007bff;
      color: #ffffff;
    }

    /* Tab Content Views */
    .tab-content {
      display: none;
    }
    .tab-content.active {
      display: block;
    }

    /* Controls */
    textarea {
      width: 100%;
      height: 150px;
      padding: 10px;
      border: 1px solid #ccc;
      border-radius: 6px;
      box-sizing: border-box;
      font-size: 14px;
      resize: vertical;
      font-family: monospace;
    }
    .primary-btn {
      margin-top: 15px;
      padding: 12px 24px;
      font-size: 16px;
      font-weight: bold;
      color: #fff;
      background-color: #28a745;
      border: none;
      border-radius: 6px;
      cursor: pointer;
      width: 100%;
    }
    .draw-btn {
      background-color: #007bff;
    }
    .primary-btn:disabled { background-color: #aaa; }

    /* Import/Export Action buttons */
    .import-group {
      display: flex;
      gap: 10px;
      margin-top: 10px;
    }
    .secondary-btn {
      flex: 1;
      padding: 10px;
      font-size: 13px;
      font-weight: bold;
      color: #333;
      background-color: #f8f9fa;
      border: 1px solid #ced4da;
      border-radius: 6px;
      cursor: pointer;
    }
    .secondary-btn:hover {
      background-color: #e2e6ea;
    }

    .display-box {
      margin-top: 15px;
      padding: 20px;
      border: 2px dashed #007bff;
      border-radius: 8px;
      min-height: 50px;
      font-size: 24px;
      font-weight: bold;
      color: #333;
      display: flex;
      align-items: center;
      justify-content: center;
    }
    .count-text {
      font-size: 13px;
      color: #6c757d;
      margin-top: 8px;
    }

    .option-box {
      margin-top: 15px;
      font-size: 14px;
      color: #333;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
    }
    .option-box input {
      cursor: pointer;
    }
    .hint-text {
      font-size: 12px;
      color: #6c757d;
      margin-bottom: 8px;
      text-align: left;
    }
  </style>
</head>
<body>

  <div class="card">
    <!-- Tab Navigation Bar -->
    <div class="tab-buttons">
      <button class="tab-btn active" onclick="switchTab('participantsTab', event)">📝 Participants</button>
      <button class="tab-btn" onclick="switchTab('drawTab', event)">🎉 Lucky Draw</button>
    </div>

    <!-- TAB 1: Manage Participants -->
    <div id="participantsTab" class="tab-content active">
      <h2>Participants List</h2>
      <div class="hint-text">Format: <code>Name - Entries</code> (e.g. <code>AAA - 5</code> or <code>BBB - 1</code>)</div>
      <textarea id="participantsInput" placeholder="AAA - 5&#10;BBB - 1&#10;Charlie - 3" oninput="saveParticipants()"></textarea>
      
      <!-- Hidden File Input supporting Excel & Text -->
      <input type="file" id="fileImporter" accept=".xlsx,.xls,.csv,.txt" style="display: none;" onchange="handleFileImport(event)">

      <!-- Import & Clear Buttons -->
      <div class="import-group">
        <button class="secondary-btn" onclick="document.getElementById('fileImporter').click()">📊 Import Excel / TXT</button>
        <button class="secondary-btn" onclick="clearAllParticipants()">🗑️ Clear All</button>
      </div>

      <div id="saveMsg" class="count-text">Saved to browser memory!</div>
    </div>

    <!-- TAB 2: Lucky Draw Menu -->
    <div id="drawTab" class="tab-content">
      <h2>🎉 Lucky Draw</h2>
      <div id="participantCount" class="count-text">0 participants (0 total entries) ready</div>
      <div id="display" class="display-box">Ready!</div>

      <div class="option-box">
        <input type="checkbox" id="removeWinnerCheck" checked>
        <label for="removeWinnerCheck">Remove winner from participant list</label>
      </div>

      <button id="drawBtn" class="primary-btn draw-btn" onclick="pickWinner()">Pick Winner</button>
    </div>
  </div>

  <script>
    window.onload = function() {
      const savedNames = localStorage.getItem('drawParticipants');
      if (savedNames) {
        document.getElementById('participantsInput').value = savedNames;
      }
      updateParticipantCount();
    };

    function switchTab(tabId, evt) {
      document.querySelectorAll('.tab-content').forEach(tab => tab.classList.remove('active'));
      document.querySelectorAll('.tab-btn').forEach(btn => btn.classList.remove('active'));

      document.getElementById(tabId).classList.add('active');
      evt.currentTarget.classList.add('active');

      if (tabId === 'drawTab') {
        updateParticipantCount();
      }
    }

    function saveParticipants() {
      const text = document.getElementById('participantsInput').value;
      localStorage.setItem('drawParticipants', text);
      updateParticipantCount();
    }

    // Parses raw lines into structured objects [{name: 'AAA', count: 5}, ...]
    function getParsedParticipants() {
      const text = document.getElementById('participantsInput').value;
      const lines = text.split('\n');
      const list = [];

      lines.forEach(line => {
        let trimmed = line.trim();
        if (!trimmed) return;

        let name = trimmed;
        let count = 1;

        // Matches formats like "AAA - 5", "AAA, 5", "AAA 5", or "AAA: 5"
        const match = trimmed.match(/^(.*?)(?:\s*[-,:]\s*|\s+)(\d+)$/);
        if (match) {
          name = match[1].trim();
          count = parseInt(match[2], 10) || 1;
        }

        if (name) {
          list.push({ name: name, count: count });
        }
      });

      return list;
    }

    // Creates flat pool where names with 5 entries appear 5 times
    function buildWeightedPool(parsedList) {
      const pool = [];
      parsedList.forEach(item => {
        for (let i = 0; i < item.count; i++) {
          pool.push(item.name);
        }
      });
      return pool;
    }

    function updateParticipantCount() {
      const parsedList = getParsedParticipants();
      const pool = buildWeightedPool(parsedList);
      document.getElementById('participantCount').innerText = 
        `${parsedList.length} unique participant(s) (${pool.length} total entries) ready`;
    }

    // Import File Handler (Excel Column A = Name, Column B = Entries)
    function handleFileImport(event) {
      const file = event.target.files[0];
      if (!file) return;

      const fileName = file.name.toLowerCase();
      
      if (fileName.endsWith('.xlsx') || fileName.endsWith('.xls')) {
        const reader = new FileReader();
        reader.onload = function(e) {
          const data = new Uint8Array(e.target.result);
          const workbook = XLSX.read(data, { type: 'array' });
          const firstSheetName = workbook.SheetNames[0];
          const worksheet = workbook.Sheets[firstSheetName];
          const rows = XLSX.utils.sheet_to_json(worksheet, { header: 1 });
          
          const formattedLines = [];
          rows.forEach(row => {
            if (row[0] !== undefined && row[0] !== null && String(row[0]).trim() !== '') {
              const name = String(row[0]).trim();
              const count = (row[1] !== undefined && row[1] !== null && !isNaN(row[1])) ? parseInt(row[1], 10) : 1;
              formattedLines.push(`${name} - ${count}`);
            }
          });

          applyImportedNames(formattedLines.join('\n'));
        };
        reader.readAsArrayBuffer(file);
      } else {
        const reader = new FileReader();
        reader.onload = function(e) {
          applyImportedNames(e.target.result.trim());
        };
        reader.readAsText(file);
      }

      event.target.value = '';
    }

    function applyImportedNames(newText) {
      const currentInput = document.getElementById('participantsInput');
      
      if (currentInput.value.trim().length > 0) {
        const append = confirm("Click OK to ADD to your existing list, or Cancel to OVERWRITE your list.");
        if (append) {
          currentInput.value = currentInput.value.trim() + '\n' + newText;
        } else {
          currentInput.value = newText;
        }
      } else {
        currentInput.value = newText;
      }

      saveParticipants();
      
      const msg = document.getElementById('saveMsg');
      msg.innerText = '✅ File imported successfully!';
      setTimeout(() => { msg.innerText = 'Saved to browser memory!'; }, 2000);
    }

    function clearAllParticipants() {
      if (confirm("Are you sure you want to clear all names?")) {
        document.getElementById('participantsInput').value = '';
        saveParticipants();
      }
    }

    function pickWinner() {
      const parsedList = getParsedParticipants();
      const pool = buildWeightedPool(parsedList);
      const display = document.getElementById('display');
      const btn = document.getElementById('drawBtn');
      const removeCheck = document.getElementById('removeWinnerCheck');

      if (pool.length === 0) {
        alert('No entries left! Switch to the Participants tab to add more names.');
        return;
      }

      btn.disabled = true;
      btn.innerText = "Drawing...";
      let counter = 0;
      const speed = 80;
      const totalCycles = 30;

      // Shuffle visual display
      const interval = setInterval(() => {
        const randomIndex = Math.floor(Math.random() * pool.length);
        display.innerText = pool[randomIndex];
        counter++;

        if (counter >= totalCycles) {
          clearInterval(interval);
          
          // Select final winner from weighted pool
          const winnerIndex = Math.floor(Math.random() * pool.length);
          const finalWinner = pool[winnerIndex];
          
          display.innerText = `🏆 ${finalWinner}!`;

          // If checkbox is checked, remove the winner entirely from the input list
          if (removeCheck.checked) {
            const updatedList = parsedList.filter(item => item.name !== finalWinner);
            const newText = updatedList.map(item => `${item.name} - ${item.count}`).join('\n');
            document.getElementById('participantsInput').value = newText;
            saveParticipants();
          }

          btn.disabled = false;
          btn.innerText = "Draw Next Winner";
        }
      }, speed);
    }
  </script>

</body>
</html>
