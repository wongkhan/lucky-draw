<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <title>Lucky Draw</title>
  <style>
    body {
      font-family: sans-serif;
      text-align: center;
      padding: 40px;
      background-color: #f0f2f5;
    }
    .box {
      background: white;
      max-width: 400px;
      margin: 0 auto;
      padding: 20px;
      border-radius: 10px;
      box-shadow: 0 4px 10px rgba(0,0,0,0.1);
    }
    textarea {
      width: 90%;
      height: 100px;
      margin-bottom: 15px;
      padding: 10px;
    }
    button {
      background: #007bff;
      color: white;
      border: none;
      padding: 10px 20px;
      font-size: 16px;
      border-radius: 5px;
      cursor: pointer;
    }
    #result {
      margin-top: 20px;
      font-size: 24px;
      font-weight: bold;
      color: #28a745;
      min-height: 35px;
    }
  </style>
</head>
<body>

  <div class="box">
    <h2>🎉 Lucky Draw</h2>
    <p>Enter names (one per line):</p>
    <textarea id="namesInput">Alice
Bob
Charlie
Diana</textarea>
    <br>
    <button onclick="drawWinner()">Pick Winner</button>
    <div id="result"></div>
  </div>

  <script>
    function drawWinner() {
      var text = document.getElementById("namesInput").value;
      var names = text.split("\n");
      var validNames = [];

      for (var i = 0; i < names.length; i++) {
        if (names[i].trim() !== "") {
          validNames.push(names[i].trim());
        }
      }

      if (validNames.length === 0) {
        alert("Please enter at least one name!");
        return;
      }

      var randomIndex = Math.floor(Math.random() * validNames.length);
      var winner = validNames[randomIndex];

      document.getElementById("result").innerText = "🏆 Winner: " + winner;
    }
  </script>

</body>
</html>
