<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Lucky Draw - Presenter Mode & History</title>
  
  <!-- SheetJS Library for Excel File Processing -->
  <script src="https://cdn.jsdelivr.net/npm/xlsx@0.18.5/dist/xlsx.full.min.js"></script>
  <!-- JS Canvas Confetti Library -->
  <script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.6.0/dist/confetti.browser.min.js"></script>

  <style>
    :root {
      --bg-color: #f4f6f8;
      --bg-image: none;
      --card-bg-color: #ffffff;
      --btn-color: #007bff;
      --btn-text-color: #ffffff;
      --display-bg-color: #fafafa;
      --display-border-color: #007bff;
      --display-text-color: #333333;
      --text-main: #333333;
      --panel-bg: #ffffff;
    }

    /* PRESENTER MODE THEME OVERRIDES */
    body.presenter-mode {
      --bg-color: #0b0f19;
      --card-bg-color: rgba(23, 31, 51, 0.75);
      --btn-color: linear-gradient(135deg, #6366f1, #a855f7, #ec4899);
      --btn-text-color: #ffffff;
      --display-bg-color: rgba(15, 23, 42, 0.85);
      --display-border-color: #a855f7;
      --display-text-color: #f8fafc;
      --text-main: #f8fafc;
    }

    * {
      box-sizing: border-box;
    }
    body {
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      background-color: var(--bg-color);
      background-image: var(--bg-image);
      background-size: cover;
      background-position: center;
      background-attachment: fixed;
      background-repeat: no-repeat;
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      margin: 0;
      overflow-x: hidden;
      transition: background 0.5s ease, color 0.5s ease;
      position: relative;
    }

    /* AMBIENT PARTICLES CANVAS */
    #particleCanvas {
      position: fixed;
      top: 0;
      left: 0;
      width: 100vw;
      height: 100vh;
      pointer-events: none;
      z-index: 1;
      opacity: 0;
      transition: opacity 1s ease;
    }
    body.presenter-mode #particleCanvas {
      opacity: 1;
    }

    /* TOP ACTION BUTTONS (TOGGLES) */
    .top-controls {
      position: fixed;
      top: 20px;
      left: 20px;
      right: 20px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      z-index: 50;
      pointer-events: none;
    }
    .top-controls > * {
      pointer-events: auto;
    }

    .top-btn-group {
      display: flex;
      gap: 10px;
    }

    /* Settings & History Action Icon Buttons */
    .toggle-panel-btn {
      height: 44px;
      padding: 0 16px;
      background: rgba(255, 255, 255, 0.25);
      color: var(--text-main);
      border: 1px solid rgba(255, 255, 255, 0.4);
      border-radius: 12px;
      font-size: 15px;
      font-weight: 600;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 6px;
      box-shadow: 0 4px 15px rgba(0, 0, 0, 0.1);
      backdrop-filter: blur(10px);
      -webkit-backdrop-filter: blur(10px);
      transition: all 0.3s ease;
    }
    .toggle-panel-btn:hover {
      background: rgba(255, 255, 255, 0.45);
      transform: scale(1.05);
    }
    body.presenter-mode .toggle-panel-btn {
      display: none !important; /* Hide setup menus in presenter mode */
    }

    /* Presenter Mode Toggle Button */
    .presenter-btn {
      background: rgba(255, 255, 255, 0.2);
      color: var(--text-main);
      border: 1px solid rgba(255, 255, 255, 0.3);
      padding: 10px 18px;
      border-radius: 30px;
      font-size: 14px;
      font-weight: 700;
      letter-spacing: 0.5px;
      cursor: pointer;
      display: flex;
      align-items: center;
      gap: 8px;
      box-shadow: 0 4px 15px rgba(0, 0, 0, 0.1);
      backdrop-filter: blur(10px);
      -webkit-backdrop-filter: blur(10px);
      transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
      margin-left: auto;
    }
    .presenter-btn:hover {
      background: rgba(255, 255, 255, 0.35);
      transform: translateY(-2px);
    }
    body.presenter-mode .presenter-btn {
      background: linear-gradient(135deg, rgba(168, 85, 247, 0.4), rgba(236, 72, 153, 0.4));
      border-color: rgba(236, 72, 153, 0.6);
      color: #ffffff;
      box-shadow: 0 0 20px rgba(168, 85, 247, 0.4);
    }

    /* MAIN CONTAINER FOR DRAW AREA */
    .main-container {
      width: 100%;
      max-width: 650px;
      padding: 20px;
      text-align: center;
      z-index: 10;
      transition: all 0.5s ease;
    }

    .card {
      background: var(--card-bg-color);
      padding: 40px 35px;
      border-radius: 24px;
      box-shadow: 0 10px 40px rgba(0,0,0,0.15);
      position: relative;
      transition: all 0.5s ease;
      backdrop-filter: blur(16px);
      -webkit-backdrop-filter: blur(16px);
      border: 1px solid rgba(255, 255, 255, 0.1);
    }

    body.presenter-mode .card {
      padding: 60px 45px;
      box-shadow: 0 20px 60px rgba(0, 0, 0, 0.6), 0 0 40px rgba(168, 85, 247, 0.15);
      border: 1px solid rgba(255, 255, 255, 0.15);
      animation: floatCard 6s ease-in-out infinite;
    }

    @keyframes floatCard {
      0%, 100% { transform: translateY(0); }
      50% { transform: translateY(-8px); }
    }

    #appTitle {
      margin-top: 0;
      margin-bottom: 10px;
      color: var(--text-main);
      transition: all 0.5s ease;
      font-size: 2.2rem;
    }

    body.presenter-mode #appTitle {
      font-size: 3.2rem;
      font-weight: 900;
      letter-spacing: 1px;
      background: linear-gradient(135deg, #ffffff 0%, #cbd5e1 50%, #a855f7 100%);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      text-shadow: 0 10px 30px rgba(0,0,0,0.5);
    }

    /* DISPLAY BOX & WINNER DRAW ANIMATIONS */
    .display-box {
      margin-top: 25px;
      padding: 35px 20px;
      border: 2px dashed var(--display-border-color);
      border-radius: 16px;
      min-height: 120px;
      font-size: 36px;
      font-weight: bold;
      color: var(--display-text-color);
      display: flex;
      align-items: center;
      justify-content: center;
      background-color: var(--display-bg-color);
      transition: all 0.3s ease;
      word-break: break-word;
      position: relative;
      overflow: hidden;
    }

    body.presenter-mode .display-box {
      min-height: 160px;
      font-size: 48px;
      border-width: 3px;
      border-style: solid;
      box-shadow: inset 0 0 20px rgba(0,0,0,0.5), 0 0 25px rgba(168, 85, 247, 0.2);
    }

    .count-text {
      font-size: 15px;
      color: #6c757d;
      margin-top: 10px;
      transition: color 0.5s ease;
    }
    body.presenter-mode .count-text {
      color: #94a3b8;
      font-size: 18px;
    }

    /* BUTTON STYLING */
    .primary-btn {
      margin-top: 25px;
      padding: 16px 32px;
      font-size: 20px;
      font-weight: 800;
      color: var(--btn-text-color);
      background: var(--btn-color);
      border: none;
      border-radius: 14px;
      cursor: pointer;
      width: 100%;
      transition: all 0.3s ease;
      box-shadow: 0 6px 20px rgba(0, 123, 255, 0.3);
    }
    .primary-btn:hover {
      transform: translateY(-2px);
      box-shadow: 0 8px 25px rgba(0, 123, 255, 0.4);
    }
    .primary-btn:disabled { 
      opacity: 0.6;
      cursor: not-allowed;
      transform: none;
    }

    body.presenter-mode .primary-btn {
      font-size: 24px;
      padding: 20px 40px;
      border-radius: 50px;
      background-size: 200% 200%;
      animation: gradientShift 4s ease infinite;
      box-shadow: 0 10px 30px rgba(168, 85, 247, 0.4);
    }

    @keyframes gradientShift {
      0% { background-position: 0% 50%; }
      50% { background-position: 100% 50%; }
      100% { background-position: 0% 50%; }
    }

    /* SIDE PANELS (LEFT & RIGHT DRAWERS) */
    .side-panel {
      position: fixed;
      top: 0;
      width: 380px;
      max-width: 85vw;
      height: 100vh;
      background: #ffffff;
      box-shadow: 0 0 20px rgba(0,0,0,0.15);
      transition: all 0.3s ease-in-out;
      z-index: 100;
      padding: 25px;
      display: flex;
      flex-direction: column;
      overflow-y: auto;
    }

    /* Settings Left Drawer */
    #sidePanel {
      left: -400px;
    }
    #sidePanel.open {
      left: 0;
    }

    /* Winner History Right Drawer */
    #historyPanel {
      right: -400px;
    }
    #historyPanel.open {
      right: 0;
    }

    .backdrop {
      position: fixed;
      top: 0;
      left: 0;
      width: 100vw;
      height: 100vh;
      background: rgba(0,0,0,0.4);
      backdrop-filter: blur(3px);
      display: none;
      z-index: 90;
    }
    .backdrop.active {
      display: block;
    }

    .panel-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 15px;
    }
    .panel-header h2 {
      margin: 0;
      font-size: 20px;
    }
    .close-btn {
      background: none;
      border: none;
      font-size: 24px;
      cursor: pointer;
      color: #6c757d;
    }

    .panel-tabs {
      display: flex;
      gap: 8px;
      margin-bottom: 15px;
      border-bottom: 1px solid #dee2e6;
      padding-bottom: 10px;
    }
    .panel-tab-btn {
      flex: 1;
      padding: 8px;
      font-size: 13px;
      font-weight: bold;
      background: #f1f3f5;
      color: #495057;
      border: none;
      border-radius: 6px;
      cursor: pointer;
    }
    .panel-tab-btn.active {
      background: #007bff;
      color: #ffffff;
    }

    .tab-view {
      display: none;
      flex-direction: column;
      flex-grow: 1;
    }
    .tab-view.active {
      display: flex;
    }

    textarea {
      width: 100%;
      flex-grow: 1;
      min-height: 180px;
      padding: 12px;
      border: 1px solid #ccc;
      border-radius: 8px;
      font-size: 14px;
      resize: vertical;
      font-family: monospace;
    }

    .import-group {
      display: flex;
      gap: 10px;
      margin-top: 12px;
    }
    .secondary-btn {
      flex: 1;
      padding: 10px;
      font-size: 13px;
      font-weight: bold;
      color: #333;
      background-color: #f8f9fa;
      border: 1px solid #ced4da;
      border-radius: 8px;
      cursor: pointer;
      transition: all 0.2s ease;
    }
    .secondary-btn:hover {
      background-color: #e2e6ea;
    }

    .option-box {
      margin-top: 15px;
      padding: 12px;
      background: #f8f9fa;
      border-radius: 8px;
      font-size: 13px;
      color: #333;
      display: flex;
      align-items: center;
      gap: 10px;
      border: 1px solid #e9ecef;
    }

    /* WINNER HISTORY LIST ITEMS */
    .history-list {
      list-style: none;
      padding: 0;
      margin: 15px 0 0 0;
      flex-grow: 1;
      overflow-y: auto;
    }

    .history-item {
      background: #f8f9fa;
      border-left: 4px solid #28a745;
      border-radius: 8px;
      padding: 12px 14px;
      margin-bottom: 10px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      box-shadow: 0 2px 5px rgba(0,0,0,0.03);
    }

    .history-info {
      display: flex;
      flex-direction: column;
      gap: 2px;
    }

    .history-name {
      font-weight: bold;
      font-size: 15px;
      color: #212529;
    }

    .history-meta {
      font-size: 11px;
      color: #6c757d;
    }

    .history-badge {
      background: #e2e8f0;
      color: #334155;
      font-size: 11px;
      font-weight: bold;
      padding: 4px 8px;
      border-radius: 12px;
    }

    .setting-item {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 15px;
      font-size: 14px;
      color: #333;
    }
    .setting-item label {
      font-weight: bold;
    }
    .setting-item input[type="color"] {
      border: 1px solid #ccc;
      border-radius: 6px;
      width: 40px;
      height: 35px;
      cursor: pointer;
      background: none;
      padding: 2px;
    }
    .setting-item input[type="text"] {
      padding: 6px 10px;
      border: 1px solid #ccc;
      border-radius: 6px;
      font-size: 13px;
      width: 180px;
    }
    .setting-block {
      margin-bottom: 15px;
    }
    .setting-block label {
      display: block;
      font-weight: bold;
      font-size: 14px;
      margin-bottom: 6px;
    }
    .setting-block input[type="text"] {
      width: 100%;
      padding: 8px 10px;
      border: 1px solid #ccc;
      border-radius: 6px;
      font-size: 13px;
    }

    /* RESPONSIVE WINNER POPUP MODAL STYLES */
    .winner-modal-overlay {
      position: fixed;
      top: 0;
      left: 0;
      width: 100vw;
      height: 100vh;
      background: rgba(0, 0, 0, 0.85);
      backdrop-filter: blur(8px);
      display: none;
      justify-content: center;
      align-items: center;
      z-index: 200;
      animation: fadeIn 0.3s ease;
      padding: 15px;
    }
    .winner-modal-overlay.active {
      display: flex;
    }

    .winner-card {
      background: #ffffff;
      padding: 40px 30px;
      border-radius: 24px;
      text-align: center;
      width: 100%;
      max-width: 520px;
      box-shadow: 0 25px 60px rgba(0, 0, 0, 0.5);
      animation: popIn 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275);
    }

    body.presenter-mode .winner-card {
      background: #1e293b;
      border: 1px solid rgba(255, 255, 255, 0.2);
      color: #f8fafc;
    }

    .winner-title {
      font-size: clamp(24px, 5vw, 40px);
      font-weight: 900;
      letter-spacing: 1px;
      text-transform: uppercase;
      background: linear-gradient(45deg, #ff4e50, #f9d423, #28a745, #007bff, #a855f7);
      background-size: 300% 300%;
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      animation: gradientGlow 4s ease infinite;
      margin: 0 0 20px 0;
      line-height: 1.2;
      word-break: break-word;
    }

    .winner-name {
      font-size: clamp(28px, 8vw, 48px);
      font-weight: 800;
      color: #1a1a1a;
      margin: 15px 0 25px 0;
      padding: 20px 15px;
      background: #f4f6f8;
      border-radius: 16px;
      border: 3px dashed #28a745;
      box-shadow: inset 0 2px 5px rgba(0,0,0,0.05);
      word-break: break-word;
      line-height: 1.2;
    }

    body.presenter-mode .winner-name {
      background: #0f172a;
      color: #f8fafc;
      border-color: #a855f7;
    }

    .modal-btn-group {
      display: flex;
      gap: 12px;
      margin-top: 10px;
    }

    @keyframes gradientGlow {
      0% { background-position: 0% 50%; }
      50% { background-position: 100% 50%; }
      100% { background-position: 0% 50%; }
    }

    @keyframes fadeIn {
      from { opacity: 0; }
      to { opacity: 1; }
    }

    @keyframes popIn {
      from { transform: scale(0.7); opacity: 0; }
      to { transform: scale(1); opacity: 1; }
    }
  </style>
</head>
<body>

  <!-- BACKGROUND FLOATING PARTICLES (PRESENTER MODE) -->
  <canvas id="particleCanvas"></canvas>

  <!-- TOP ACTION CONTROLS -->
  <div class="top-controls">
    <div class="top-btn-group">
      <!-- Settings Panel Button -->
      <button class="toggle-panel-btn" onclick="openPanel('sidePanel')" title="Settings">
        ⚙️ Settings
      </button>

      <!-- Winner History Drawer Button -->
      <button class="toggle-panel-btn" onclick="openPanel('historyPanel')" title="Winner History Log">
        🏆 History (<span id="historyCount">0</span>)
      </button>
    </div>

    <!-- Presenter Mode Toggle Button -->
    <button class="presenter-btn" onclick="togglePresenterMode()" title="Toggle Event View (Key: F)">
      <span id="presenterIcon">📺</span>
      <span id="presenterText">Presenter Mode</span>
    </button>
  </div>

  <!-- Background Overlay for Side Panels -->
  <div id="backdrop" class="backdrop" onclick="closeAllPanels()"></div>

  <!-- LEFT PANEL: SETTINGS & PARTICIPANTS -->
  <div id="sidePanel" class="side-panel">
    <div class="panel-header">
      <h2>⚙️ Settings</h2>
      <button class="close-btn" onclick="closeAllPanels()">&times;</button>
    </div>

    <!-- Panel Tabs -->
    <div class="panel-tabs">
      <button class="panel-tab-btn active" onclick="switchPanelTab('participantsTab', event)">📝 Participants</button>
      <button class="panel-tab-btn" onclick="switchPanelTab('appearanceTab', event)">🎨 Appearance</button>
    </div>

    <!-- TAB 1: PARTICIPANTS -->
    <div id="participantsTab" class="tab-view active">
      <div class="hint-text" style="font-size: 12px; color: #6c757d; margin-bottom: 8px;">Format: <code>Name - Entries</code> (e.g. <code>AAA - 5</code>)</div>
      <textarea id="participantsInput" placeholder="AAA - 5&#10;BBB - 1&#10;Charlie - 3" oninput="saveParticipants()"></textarea>
      
      <!-- Hidden File Input -->
      <input type="file" id="fileImporter" accept=".xlsx,.xls,.csv,.txt" style="display: none;" onchange="handleFileImport(event)">

      <!-- Import & Clear Buttons -->
      <div class="import-group">
        <button class="secondary-btn" onclick="document.getElementById('fileImporter').click()">📊 Import File</button>
        <button class="secondary-btn" onclick="clearAllParticipants()">🗑️ Clear All</button>
      </div>

      <div id="saveMsg" class="count-text" style="text-align: center;">Saved to browser memory!</div>
    </div>

    <!-- TAB 2: APPEARANCE SETTINGS -->
    <div id="appearanceTab" class="tab-view">
      <div class="setting-item">
        <label for="titleInput">Title Text</label>
        <input type="text" id="titleInput" value="🎉 Lucky Draw" oninput="updateAppearance()">
      </div>

      <div class="setting-block">
        <label for="bgImageUrl">Background Image URL</label>
        <input type="text" id="bgImageUrl" placeholder="https://example.com/image.jpg" oninput="updateAppearance()">
      </div>

      <div class="setting-block">
        <label>Or Upload Background Image</label>
        <input type="file" id="bgImageFile" accept="image/*" style="font-size: 12px; width: 100%;" onchange="handleBgImageUpload(event)">
        <button class="secondary-btn" style="margin-top: 6px; padding: 6px; font-size: 11px;" onclick="removeBgImage()">❌ Remove Image</button>
      </div>

      <hr style="border: none; border-top: 1px solid #eee; margin: 10px 0 15px 0;">

      <div class="setting-item">
        <label for="bgColor">Page Fallback Color</label>
        <input type="color" id="bgColor" value="#f4f6f8" onchange="updateAppearance()">
      </div>

      <div class="setting-item">
        <label for="cardBgColor">Card Background</label>
        <input type="color" id="cardBgColor" value="#ffffff" onchange="updateAppearance()">
      </div>

      <div class="setting-item">
        <label for="btnColor">Button Color</label>
        <input type="color" id="btnColor" value="#007bff" onchange="updateAppearance()">
      </div>

      <div class="setting-item">
        <label for="displayBgColor">Display Box Fill</label>
        <input type="color" id="displayBgColor" value="#fafafa" onchange="updateAppearance()">
      </div>

      <div class="setting-item">
        <label for="displayBorderColor">Display Box Border</label>
        <input type="color" id="displayBorderColor" value="#007bff" onchange="updateAppearance()">
      </div>

      <div class="setting-item">
        <label for="displayTextColor">Display Text Color</label>
        <input type="color" id="displayTextColor" value="#333333" onchange="updateAppearance()">
      </div>

      <button class="secondary-btn" style="margin-top: 15px;" onclick="resetAppearance()">🔄 Reset Default Theme</button>
    </div>
  </div>

  <!-- RIGHT PANEL: WINNER HISTORY LOG -->
  <div id="historyPanel" class="side-panel">
    <div class="panel-header">
      <h2>🏆 Winner History</h2>
      <button class="close-btn" onclick="closeAllPanels()">&times;</button>
    </div>

    <!-- Live Auto-Removal Rules Toggle -->
    <div class="option-box">
      <input type="checkbox" id="removeWinnerCheck" checked onchange="saveRuleSetting()">
      <label for="removeWinnerCheck" style="font-weight: 600; cursor: pointer;">Automatically remove winners from future draws</label>
    </div>

    <!-- History List View -->
    <ul id="historyList" class="history-list">
      <!-- Winner items injected via JS -->
    </ul>

    <!-- Export & Clear History Controls -->
    <div class="import-group" style="margin-top: auto;">
      <button class="secondary-btn" style="background-color: #28a745; color: white; border: none;" onclick="exportWinnerHistoryCSV()">💾 Export Log (CSV)</button>
      <button class="secondary-btn" onclick="clearWinnerHistory()">🗑️ Clear History</button>
    </div>
  </div>

  <!-- MAIN LUCKY DRAW SCREEN -->
  <div class="main-container">
    <div class="card">
      <h1 id="appTitle">🎉 Lucky Draw</h1>
      <div id="participantCount" class="count-text">0 unique participants (0 total entries)</div>

      <div id="display" class="display-box">Ready!</div>

      <button id="drawBtn" class="primary-btn" onclick="pickWinner()">Pick Winner</button>
    </div>
  </div>

  <!-- CONGRATULATIONS WINNER POPUP MODAL -->
  <div id="winnerModal" class="winner-modal-overlay">
    <div class="winner-card">
      <div class="winner-title">🎉 CONGRATULATIONS! 🎉</div>
      <div id="modalWinnerName" class="winner-name">Name</div>
      
      <div class="modal-btn-group">
        <button class="secondary-btn" onclick="closeWinnerModal()">Close</button>
        <button class="primary-btn" style="margin-top: 0;" onclick="closeWinnerModal(); pickWinner();">Draw Next Winner</button>
      </div>
    </div>
  </div>

  <script>
    const defaultTheme = {
      title: "🎉 Lucky Draw",
      bgImage: "",
      bgColor: "#f4f6f8",
      cardBgColor: "#ffffff",
      btnColor: "#007bff",
      displayBgColor: "#fafafa",
      displayBorderColor: "#007bff",
      displayTextColor: "#333333"
    };

    let winnerHistoryLog = [];

    window.onload = function() {
      // Load Participants
      const savedNames = localStorage.getItem('drawParticipants');
      if (savedNames) {
        document.getElementById('participantsInput').value = savedNames;
      }
      updateParticipantCount();

      // Load Removal Rule Preference
      const savedRule = localStorage.getItem('removeWinnerRule');
      if (savedRule !== null) {
        document.getElementById('removeWinnerCheck').checked = (savedRule === 'true');
      }

      // Load Winner History Log
      const savedHistory = localStorage.getItem('winnerHistoryLog');
      if (savedHistory) {
        try {
          winnerHistoryLog = JSON.parse(savedHistory);
          renderWinnerHistory();
        } catch(e) { winnerHistoryLog = []; }
      }

      // Load Appearance Settings
      loadAppearance();

      // Initialize Ambient Particles
      initParticles();
    };

    function saveRuleSetting() {
      const isChecked = document.getElementById('removeWinnerCheck').checked;
      localStorage.setItem('removeWinnerRule', isChecked);
    }

    // PRESENTER MODE TOGGLE
    function togglePresenterMode() {
      const isPresenter = document.body.classList.toggle('presenter-mode');
      const btnText = document.getElementById('presenterText');
      const btnIcon = document.getElementById('presenterIcon');

      if (isPresenter) {
        btnText.innerText = "Exit Presenter";
        btnIcon.innerText = "✕";
        closeAllPanels();

        if (document.documentElement.requestFullscreen) {
          document.documentElement.requestFullscreen().catch(() => {});
        }
      } else {
        btnText.innerText = "Presenter Mode";
        btnIcon.innerText = "📺";

        if (document.exitFullscreen && document.fullscreenElement) {
          document.exitFullscreen().catch(() => {});
        }
      }
    }

    // Keyboard Shortcuts for Presenter Mode
    document.addEventListener('keydown', function(e) {
      if (e.key === 'f' || e.key === 'F') {
        if (['INPUT', 'TEXTAREA'].includes(document.activeElement.tagName)) return;
        togglePresenterMode();
      }
    });

    // AMBIENT BACKGROUND PARTICLES
    function initParticles() {
      const canvas = document.getElementById('particleCanvas');
      const ctx = canvas.getContext('2d');
      let particles = [];

      function resize() {
        canvas.width = window.innerWidth;
        canvas.height = window.innerHeight;
      }
      window.addEventListener('resize', resize);
      resize();

      class Particle {
        constructor() {
          this.reset();
        }
        reset() {
          this.x = Math.random() * canvas.width;
          this.y = Math.random() * canvas.height;
          this.size = Math.random() * 3 + 1;
          this.speedX = (Math.random() - 0.5) * 0.8;
          this.speedY = (Math.random() - 0.5) * 0.8;
          this.alpha = Math.random() * 0.5 + 0.2;
          this.color = ['#a855f7', '#ec4899', '#6366f1', '#3b82f6'][Math.floor(Math.random() * 4)];
        }
        update() {
          this.x += this.speedX;
          this.y += this.speedY;

          if (this.x < 0 || this.x > canvas.width) this.speedX *= -1;
          if (this.y < 0 || this.y > canvas.height) this.speedY *= -1;
        }
        draw() {
          ctx.save();
          ctx.globalAlpha = this.alpha;
          ctx.fillStyle = this.color;
          ctx.shadowBlur = 10;
          ctx.shadowColor = this.color;
          ctx.beginPath();
          ctx.arc(this.x, this.y, this.size, 0, Math.PI * 2);
          ctx.fill();
          ctx.restore();
        }
      }

      for (let i = 0; i < 50; i++) {
        particles.push(new Particle());
      }

      function animate() {
        ctx.clearRect(0, 0, canvas.width, canvas.height);
        if (document.body.classList.contains('presenter-mode')) {
          particles.forEach(p => {
            p.update();
            p.draw();
          });
        }
        requestAnimationFrame(animate);
      }
      animate();
    }

    // Drawer Panels Navigation Functions
    function openPanel(panelId) {
      closeAllPanels();
      document.getElementById(panelId).classList.add('open');
      document.getElementById('backdrop').classList.add('active');
    }

    function closeAllPanels() {
      document.querySelectorAll('.side-panel').forEach(p => p.classList.remove('open'));
      document.getElementById('backdrop').classList.remove('active');
    }

    function switchPanelTab(tabId, evt) {
      document.querySelectorAll('.tab-view').forEach(tab => tab.classList.remove('active'));
      document.querySelectorAll('.panel-tab-btn').forEach(btn => btn.classList.remove('active'));

      document.getElementById(tabId).classList.add('active');
      evt.currentTarget.classList.add('active');
    }

    // Appearance Theme Handling
    function updateAppearance() {
      const theme = {
        title: document.getElementById('titleInput').value || "🎉 Lucky Draw",
        bgImage: document.getElementById('bgImageUrl').value.trim(),
        bgColor: document.getElementById('bgColor').value,
        cardBgColor: document.getElementById('cardBgColor').value,
        btnColor: document.getElementById('btnColor').value,
        displayBgColor: document.getElementById('displayBgColor').value,
        displayBorderColor: document.getElementById('displayBorderColor').value,
        displayTextColor: document.getElementById('displayTextColor').value
      };

      applyTheme(theme);
      try {
        localStorage.setItem('drawTheme', JSON.stringify(theme));
      } catch (e) {
        console.warn("Storage limit reached for uploaded image");
      }
    }

    function handleBgImageUpload(event) {
      const file = event.target.files[0];
      if (!file) return;

      const reader = new FileReader();
      reader.onload = function(e) {
        document.getElementById('bgImageUrl').value = e.target.result;
        updateAppearance();
      };
      reader.readAsDataURL(file);
    }

    function removeBgImage() {
      document.getElementById('bgImageUrl').value = '';
      document.getElementById('bgImageFile').value = '';
      updateAppearance();
    }

    function applyTheme(theme) {
      document.getElementById('appTitle').innerText = theme.title;
      document.getElementById('titleInput').value = theme.title;
      document.getElementById('bgImageUrl').value = theme.bgImage || '';

      const root = document.documentElement;
      root.style.setProperty('--bg-color', theme.bgColor);
      
      if (theme.bgImage) {
        root.style.setProperty('--bg-image', `url("${theme.bgImage}")`);
      } else {
        root.style.setProperty('--bg-image', 'none');
      }

      root.style.setProperty('--card-bg-color', theme.cardBgColor);
      root.style.setProperty('--btn-color', theme.btnColor);
      root.style.setProperty('--display-bg-color', theme.displayBgColor);
      root.style.setProperty('--display-border-color', theme.displayBorderColor);
      root.style.setProperty('--display-text-color', theme.displayTextColor);

      document.getElementById('bgColor').value = theme.bgColor;
      document.getElementById('cardBgColor').value = theme.cardBgColor;
      document.getElementById('btnColor').value = theme.btnColor;
      document.getElementById('displayBgColor').value = theme.displayBgColor;
      document.getElementById('displayBorderColor').value = theme.displayBorderColor;
      document.getElementById('displayTextColor').value = theme.displayTextColor;
    }

    function loadAppearance() {
      const savedTheme = localStorage.getItem('drawTheme');
      if (savedTheme) {
        applyTheme(JSON.parse(savedTheme));
      } else {
        applyTheme(defaultTheme);
      }
    }

    function resetAppearance() {
      document.getElementById('bgImageFile').value = '';
      applyTheme(defaultTheme);
      localStorage.removeItem('drawTheme');
    }

    // Data & Participant Management
    function saveParticipants() {
      const text = document.getElementById('participantsInput').value;
      localStorage.setItem('drawParticipants', text);
      updateParticipantCount();
    }

    function getParsedParticipants() {
      const text = document.getElementById('participantsInput').value;
      const lines = text.split('\n');
      const list = [];

      lines.forEach(line => {
        let trimmed = line.trim();
        if (!trimmed) return;

        let name = trimmed;
        let count = 1;

        const match = trimmed.match(/^(.*?)(?:\s*[-,:]\s*|\s+)(\d+)$/);
        if (match) {
          name = match[1].trim();
          count = parseInt(match[2], 10) || 1;
        }

        if (name) {
          list.push({ name: name, count: count });
        }
      });

      return list;
    }

    function buildWeightedPool(parsedList) {
      const pool = [];
      parsedList.forEach(item => {
        for (let i = 0; i < item.count; i++) {
          pool.push(item.name);
        }
      });
      return pool;
    }

    function updateParticipantCount() {
      const parsedList = getParsedParticipants();
      const pool = buildWeightedPool(parsedList);
      document.getElementById('participantCount').innerText = 
        `${parsedList.length} unique participants (${pool.length} total entries) ready`;
    }

    function handleFileImport(event) {
      const file = event.target.files[0];
      if (!file) return;

      const fileName = file.name.toLowerCase();
      
      if (fileName.endsWith('.xlsx') || fileName.endsWith('.xls')) {
        const reader = new FileReader();
        reader.onload = function(e) {
          const data = new Uint8Array(e.target.result);
          const workbook = XLSX.read(data, { type: 'array' });
          const firstSheetName = workbook.SheetNames[0];
          const worksheet = workbook.Sheets[firstSheetName];
          const rows = XLSX.utils.sheet_to_json(worksheet, { header: 1 });
          
          const formattedLines = [];
          rows.forEach(row => {
            if (row[0] !== undefined && row[0] !== null && String(row[0]).trim() !== '') {
              const name = String(row[0]).trim();
              const count = (row[1] !== undefined && row[1] !== null && !isNaN(row[1])) ? parseInt(row[1], 10) : 1;
              formattedLines.push(`${name} - ${count}`);
            }
          });

          applyImportedNames(formattedLines.join('\n'));
        };
        reader.readAsArrayBuffer(file);
      } else {
        const reader = new FileReader();
        reader.onload = function(e) {
          applyImportedNames(e.target.result.trim());
        };
        reader.readAsText(file);
      }

      event.target.value = '';
    }

    function applyImportedNames(newText) {
      const currentInput = document.getElementById('participantsInput');
      
      if (currentInput.value.trim().length > 0) {
        const append = confirm("Click OK to ADD to your existing list, or Cancel to OVERWRITE your list.");
        if (append) {
          currentInput.value = currentInput.value.trim() + '\n' + newText;
        } else {
          currentInput.value = newText;
        }
      } else {
        currentInput.value = newText;
      }

      saveParticipants();
      
      const msg = document.getElementById('saveMsg');
      msg.innerText = '✅ File imported successfully!';
      setTimeout(() => { msg.innerText = 'Saved to browser memory!'; }, 2000);
    }

    function clearAllParticipants() {
      if (confirm("Are you sure you want to clear all names?")) {
        document.getElementById('participantsInput').value = '';
        saveParticipants();
      }
    }

    // WINNER HISTORY LOGGING & EXPORT
    function recordWinnerHistory(winnerName, remainingEntries) {
      const timestamp = new Date().toLocaleString();
      const logItem = {
        name: winnerName,
        time: timestamp,
        remaining: remainingEntries
      };

      winnerHistoryLog.unshift(logItem); // Add to top of list
      localStorage.setItem('winnerHistoryLog', JSON.stringify(winnerHistoryLog));
      renderWinnerHistory();
    }

    function renderWinnerHistory() {
      const listEl = document.getElementById('historyList');
      const countEl = document.getElementById('historyCount');
      
      countEl.innerText = winnerHistoryLog.length;

      if (winnerHistoryLog.length === 0) {
        listEl.innerHTML = '<li style="text-align: center; color: #6c757d; margin-top: 30px; font-size: 14px;">No winners drawn yet.</li>';
        return;
      }

      listEl.innerHTML = winnerHistoryLog.map(item => `
        <li class="history-item">
          <div class="history-info">
            <span class="history-name">${escapeHtml(item.name)}</span>
            <span class="history-meta">🕒 ${item.time}</span>
          </div>
          <span class="history-badge">${item.remaining} left</span>
        </li>
      `).join('');
    }

    function exportWinnerHistoryCSV() {
      if (winnerHistoryLog.length === 0) {
        alert("No winner history to export!");
        return;
      }

      let csvContent = "data:text/csv;charset=utf-8,Draw #,Winner Name,Timestamp,Remaining Entries\n";
      
      winnerHistoryLog.forEach((item, idx) => {
        const drawNumber = winnerHistoryLog.length - idx;
        const cleanName = `"${item.name.replace(/"/g, '""')}"`;
        const cleanTime = `"${item.time}"`;
        csvContent += `${drawNumber},${cleanName},${cleanTime},${item.remaining}\n`;
      });

      const encodedUri = encodeURI(csvContent);
      const link = document.createElement("a");
      link.setAttribute("href", encodedUri);
      link.setAttribute("download", `Lucky_Draw_Winners_${new Date().toISOString().slice(0,10)}.csv`);
      document.body.appendChild(link);
      link.click();
      document.body.removeChild(link);
    }

    function clearWinnerHistory() {
      if (confirm("Are you sure you want to clear the winner history log?")) {
        winnerHistoryLog = [];
        localStorage.removeItem('winnerHistoryLog');
        renderWinnerHistory();
      }
    }

    function escapeHtml(str) {
      return str.replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;");
    }

    // Modal & Confetti Functions
    function showWinnerModal(winnerName) {
      document.getElementById('modalWinnerName').innerText = winnerName;
      document.getElementById('winnerModal').classList.add('active');
      
      if (typeof confetti === 'function') {
        confetti({
          particleCount: 150,
          spread: 100,
          origin: { y: 0.6 },
          colors: ['#a855f7', '#ec4899', '#3b82f6', '#22c55e', '#eab308']
        });
      }
    }

    function closeWinnerModal() {
      document.getElementById('winnerModal').classList.remove('active');
    }

    // PICK WINNER EXECUTION
    function pickWinner() {
      const parsedList = getParsedParticipants();
      const pool = buildWeightedPool(parsedList);
      const display = document.getElementById('display');
      const btn = document.getElementById('drawBtn');
      const removeCheck = document.getElementById('removeWinnerCheck');

      if (pool.length === 0) {
        alert('No entries left! Add participants in Settings.');
        return;
      }

      btn.disabled = true;
      btn.innerText = "Drawing...";
      let counter = 0;
      const speed = 70;
      const totalCycles = 35;

      const interval = setInterval(() => {
        const randomIndex = Math.floor(Math.random() * pool.length);
        display.innerText = pool[randomIndex];
        counter++;

        if (counter >= totalCycles) {
          clearInterval(interval);
          
          const winnerIndex = Math.floor(Math.random() * pool.length);
          const finalWinner = pool[winnerIndex];
          
          display.innerText = `🏆 ${finalWinner}!`;

          // Handle Winner Removal or Entry Decrement
          let remainingEntries = 0;
          if (removeCheck.checked) {
            const updatedList = parsedList.filter(item => item.name !== finalWinner);
            const newText = updatedList.map(item => `${item.name} - ${item.count}`).join('\n');
            document.getElementById('participantsInput').value = newText;
            saveParticipants();
            remainingEntries = 0;
          } else {
            const winnerObj = parsedList.find(item => item.name === finalWinner);
            remainingEntries = winnerObj ? winnerObj.count : 1;
          }

          // Record Winner to History Log
          recordWinnerHistory(finalWinner, remainingEntries);

          // Show Congratulations Popup Modal
          showWinnerModal(finalWinner);

          btn.disabled = false;
          btn.innerText = "Draw Next Winner";
        }
      }, speed);
    }
  </script>
