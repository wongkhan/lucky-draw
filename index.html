<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Lucky Draw</title>
  
  <!-- SheetJS Library for Excel File Processing -->
  <script src="https://cdn.jsdelivr.net/npm/xlsx@0.18.5/dist/xlsx.full.min.js"></script>

  <style>
    * {
      box-sizing: border-box;
    }
    body {
      font-family: Arial, sans-serif;
      background-color: #f4f6f8;
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      margin: 0;
      overflow-x: hidden;
    }

    /* Main Container for Draw Area */
    .main-container {
      width: 100%;
      max-width: 500px;
      padding: 20px;
      text-align: center;
    }

    .card {
      background: #ffffff;
      padding: 35px 30px;
      border-radius: 16px;
      box-shadow: 0 8px 25px rgba(0,0,0,0.08);
      position: relative;
    }

    /* Side Panel / Drawer Styles */
    .side-panel {
      position: fixed;
      top: 0;
      left: -380px; /* Hidden by default */
      width: 380px;
      height: 100vh;
      background: #ffffff;
      box-shadow: 4px 0 20px rgba(0,0,0,0.15);
      transition: left 0.3s ease-in-out;
      z-index: 100;
      padding: 25px;
      display: flex;
      flex-direction: column;
    }

    .side-panel.open {
      left: 0; /* Expanded */
    }

    /* Overlay backdrop when side panel is open */
    .backdrop {
      position: fixed;
      top: 0;
      left: 0;
      width: 100vw;
      height: 100vh;
      background: rgba(0,0,0,0.3);
      display: none;
      z-index: 90;
    }
    .backdrop.active {
      display: block;
    }

    /* Side Panel Toggle Button */
    .toggle-panel-btn {
      position: absolute;
      top: 15px;
      left: 15px;
      background: #f8f9fa;
      border: 1px solid #ced4da;
      border-radius: 8px;
      padding: 8px 12px;
      font-size: 13px;
      font-weight: bold;
      cursor: pointer;
      display: flex;
      align-items: center;
      gap: 6px;
    }
    .toggle-panel-btn:hover {
      background: #e2e6ea;
    }

    .panel-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 15px;
    }
    .panel-header h2 {
      margin: 0;
      font-size: 20px;
    }
    .close-btn {
      background: none;
      border: none;
      font-size: 24px;
      cursor: pointer;
      color: #6c757d;
    }

    /* Controls & Buttons */
    textarea {
      width: 100%;
      flex-grow: 1;
      height: 220px;
      padding: 12px;
      border: 1px solid #ccc;
      border-radius: 8px;
      font-size: 14px;
      resize: vertical;
      font-family: monospace;
    }

    .primary-btn {
      margin-top: 15px;
      padding: 14px 24px;
      font-size: 18px;
      font-weight: bold;
      color: #fff;
      background-color: #007bff;
      border: none;
      border-radius: 8px;
      cursor: pointer;
      width: 100%;
    }
    .primary-btn:disabled { background-color: #aaa; }

    .import-group {
      display: flex;
      gap: 10px;
      margin-top: 12px;
    }
    .secondary-btn {
      flex: 1;
      padding: 10px;
      font-size: 13px;
      font-weight: bold;
      color: #333;
      background-color: #f8f9fa;
      border: 1px solid #ced4da;
      border-radius: 8px;
      cursor: pointer;
    }
    .secondary-btn:hover {
      background-color: #e2e6ea;
    }

    .display-box {
      margin-top: 20px;
      padding: 25px;
      border: 2px dashed #007bff;
      border-radius: 12px;
      min-height: 80px;
      font-size: 28px;
      font-weight: bold;
      color: #333;
      display: flex;
      align-items: center;
      justify-content: center;
      background-color: #fafafa;
    }
    .count-text {
      font-size: 14px;
      color: #6c757d;
      margin-top: 10px;
    }

    .option-box {
      margin-top: 20px;
      font-size: 14px;
      color: #333;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
    }
    .option-box input {
      cursor: pointer;
    }
    .hint-text {
      font-size: 12px;
      color: #6c757d;
      margin-bottom: 10px;
      text-align: left;
    }
  </style>
</head>
<body>

  <!-- Background Overlay for Side Panel -->
  <div id="backdrop" class="backdrop" onclick="closePanel()"></div>

  <!-- COLLAPSIBLE SIDE PANEL -->
  <div id="sidePanel" class="side-panel">
    <div class="panel-header">
      <h2>📝 Participants</h2>
      <button class="close-btn" onclick="closePanel()">&times;</button>
    </div>
    
    <div class="hint-text">Format: <code>Name - Entries</code> (e.g. <code>AAA - 5</code>)</div>
    <textarea id="participantsInput" placeholder="AAA - 5&#10;BBB - 1&#10;Charlie - 3" oninput="saveParticipants()"></textarea>
    
    <!-- Hidden File Input supporting Excel & Text -->
    <input type="file" id="fileImporter" accept=".xlsx,.xls,.csv,.txt" style="display: none;" onchange="handleFileImport(event)">

    <!-- Import & Clear Buttons -->
    <div class="import-group">
      <button class="secondary-btn" onclick="document.getElementById('fileImporter').click()">📊 Import Excel/TXT</button>
      <button class="secondary-btn" onclick="clearAllParticipants()">🗑️ Clear All</button>
    </div>

    <div id="saveMsg" class="count-text" style="text-align: center;">Saved to browser memory!</div>
  </div>

  <!-- MAIN LUCKY DRAW SCREEN -->
  <div class="main-container">
    <div class="card">
      
      <!-- Panel Expand Trigger -->
      <button class="toggle-panel-btn" onclick="openPanel()">
        ⚙️ Manage List
      </button>

      <h1 style="margin-top: 30px; margin-bottom: 5px;">🎉 Lucky Draw</h1>
      <div id="participantCount" class="count-text">0 unique participants (0 total entries)</div>

      <div id="display" class="display-box">Ready!</div>

      <div class="option-box">
        <input type="checkbox" id="removeWinnerCheck" checked>
        <label for="removeWinnerCheck">Remove winner from participant list</label>
      </div>

      <button id="drawBtn" class="primary-btn" onclick="pickWinner()">Pick Winner</button>
    </div>
  </div>

  <script>
    window.onload = function() {
      const savedNames = localStorage.getItem('drawParticipants');
      if (savedNames) {
        document.getElementById('participantsInput').value = savedNames;
      }
      updateParticipantCount();
    };

    // Panel Expand/Collapse Functions
    function openPanel() {
      document.getElementById('sidePanel').classList.add('open');
      document.getElementById('backdrop').classList.add('active');
    }

    function closePanel() {
      document.getElementById('sidePanel').classList.remove('open');
      document.getElementById('backdrop').classList.remove('active');
    }

    function saveParticipants() {
      const text = document.getElementById('participantsInput').value;
      localStorage.setItem('drawParticipants', text);
      updateParticipantCount();
    }

    // Parses raw lines into structured objects
    function getParsedParticipants() {
      const text = document.getElementById('participantsInput').value;
      const lines = text.split('\n');
      const list = [];

      lines.forEach(line => {
        let trimmed = line.trim();
        if (!trimmed) return;

        let name = trimmed;
        let count = 1;

        const match = trimmed.match(/^(.*?)(?:\s*[-,:]\s*|\s+)(\d+)$/);
        if (match) {
          name = match[1].trim();
          count = parseInt(match[2], 10) || 1;
        }

        if (name) {
          list.push({ name: name, count: count });
        }
      });

      return list;
    }

    function buildWeightedPool(parsedList) {
      const pool = [];
      parsedList.forEach(item => {
        for (let i = 0; i < item.count; i++) {
          pool.push(item.name);
        }
      });
      return pool;
    }

    function updateParticipantCount() {
      const parsedList = getParsedParticipants();
      const pool = buildWeightedPool(parsedList);
      document.getElementById('participantCount').innerText = 
        `${parsedList.length} unique participants (${pool.length} total entries) ready`;
    }

    // Import File Handler (Excel Column A = Name, Column B = Entries)
    function handleFileImport(event) {
      const file = event.target.files[0];
      if (!file) return;

      const fileName = file.name.toLowerCase();
      
      if (fileName.endsWith('.xlsx') || fileName.endsWith('.xls')) {
        const reader = new FileReader();
        reader.onload = function(e) {
          const data = new Uint8Array(e.target.result);
          const workbook = XLSX.read(data, { type: 'array' });
          const firstSheetName = workbook.SheetNames[0];
          const worksheet = workbook.Sheets[firstSheetName];
          const rows = XLSX.utils.sheet_to_json(worksheet, { header: 1 });
          
          const formattedLines = [];
          rows.forEach(row => {
            if (row[0] !== undefined && row[0] !== null && String(row[0]).trim() !== '') {
              const name = String(row[0]).trim();
              const count = (row[1] !== undefined && row[1] !== null && !isNaN(row[1])) ? parseInt(row[1], 10) : 1;
              formattedLines.push(`${name} - ${count}`);
            }
          });

          applyImportedNames(formattedLines.join('\n'));
        };
        reader.readAsArrayBuffer(file);
      } else {
        const reader = new FileReader();
        reader.onload = function(e) {
          applyImportedNames(e.target.result.trim());
        };
        reader.readAsText(file);
      }

      event.target.value = '';
    }

    function applyImportedNames(newText) {
      const currentInput = document.getElementById('participantsInput');
      
      if (currentInput.value.trim().length > 0) {
        const append = confirm("Click OK to ADD to your existing list, or Cancel to OVERWRITE your list.");
        if (append) {
          currentInput.value = currentInput.value.trim() + '\n' + newText;
        } else {
          currentInput.value = newText;
        }
      } else {
        currentInput.value = newText;
      }

      saveParticipants();
      
      const msg = document.getElementById('saveMsg');
      msg.innerText = '✅ File imported successfully!';
      setTimeout(() => { msg.innerText = 'Saved to browser memory!'; }, 2000);
    }

    function clearAllParticipants() {
      if (confirm("Are you sure you want to clear all names?")) {
        document.getElementById('participantsInput').value = '';
        saveParticipants();
      }
    }

    function pickWinner() {
      const parsedList = getParsedParticipants();
      const pool = buildWeightedPool(parsedList);
      const display = document.getElementById('display');
      const btn = document.getElementById('drawBtn');
      const removeCheck = document.getElementById('removeWinnerCheck');

      if (pool.length === 0) {
        alert('No entries left! Click "⚙️ Manage List" on the top left to add participants.');
        return;
      }

      btn.disabled = true;
      btn.innerText = "Drawing...";
      let counter = 0;
      const speed = 80;
      const totalCycles = 30;

      const interval = setInterval(() => {
        const randomIndex = Math.floor(Math.random() * pool.length);
        display.innerText = pool[randomIndex];
        counter++;

        if (counter >= totalCycles) {
          clearInterval(interval);
          
          const winnerIndex = Math.floor(Math.random() * pool.length);
          const finalWinner = pool[winnerIndex];
          
          display.innerText = `🏆 ${finalWinner}!`;

          if (removeCheck.checked) {
            const updatedList = parsedList.filter(item => item.name !== finalWinner);
            const newText = updatedList.map(item => `${item.name} - ${item.count}`).join('\n');
            document.getElementById('participantsInput').value = newText;
            saveParticipants();
          }

          btn.disabled = false;
          btn.innerText = "Draw Next Winner";
        }
      }, speed);
    }
  </script>

</body>
</html>
